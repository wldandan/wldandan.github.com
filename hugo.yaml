baseURL: "https://wldandan.github.io/"
locale: "zh-CN"
title: "Think Deeply. Build Wisely. Live Fully."
paginate: 10
publishDir: "public"
enableRobotsTXT: true
permalinks:
  posts: "/blog/:year/:month/:day/:slug/"
  taxonomy:
    categories: "/blog/categories/"
  term:
    categories: "/blog/categories/:slug/"
taxonomies:
  category: categories
  tag: tags
markup:
  goldmark:
    renderer:
      unsafe: true
params:
  author: "wldandan"
  description: "Systems, software & the craft of making things work."
  disqusShortname: "happycodehappylife"
outputs:
  home: [HTML, RSS]
