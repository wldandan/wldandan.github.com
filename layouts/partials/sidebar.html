<aside class="sidebar">
  <section class="explore-panel">
    <h1>Explore</h1>
    <h2>Recent notes</h2>
    <ul class="recent-notes">{{ range first 5 (where .Site.RegularPages "Section" "posts") }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ul>
    <h2>Topics</h2>
    <div class="topic-list">{{ range .Site.Taxonomies.categories.ByCount }}<a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span>{{ .Count }}</span></a>{{ end }}</div>
  </section>
</aside>
