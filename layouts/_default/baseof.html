<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if and .Title (not .IsHome) }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
    <meta name="author" content="{{ .Site.Params.author }}">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="icon" href="{{ "favicon.png" | relURL }}">
    <link rel="stylesheet" href="{{ "stylesheets/screen.css" | relURL }}">
    <link rel="stylesheet" href="{{ "editorial.css" | relURL }}">
    <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | relURL }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  </head>
  <body>
    {{ partial "header.html" . }}
    <nav role="navigation">{{ partial "navigation.html" . }}</nav>
    <div id="main"><div id="content">{{ block "main" . }}{{ end }}</div></div>
    {{ partial "footer.html" . }}
  </body>
</html>
